name: Validate Nocturne MV Studio
on:
  push:
    branches: [main]
    paths:
      - "server.ts"
      - "src/**"
      - "prisma/**"
      - "package.json"
      - ".github/workflows/validate-studio.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
